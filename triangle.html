{% extends "base.html" %}
{% block title %}Triangle Area - My Portfolio{% endblock %}

{% block content %}
<div class="container">
    <h1>Area of a Triangle</h1>
    <div class="form-card">
        <form method="POST">
            <label for="base">Base:</label>
            <input type="number" step="any" min="0" name="base" id="base" required>

            <label for="height">Height:</label>
            <input type="number" step="any" min="0" name="height" id="height" required>

            <button class="btn" type="submit">Calculate Area</button>
        </form>

        {% if result is not none %}
        <div class="result">
            <strong>Area:</strong> {{ result }} square units
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
